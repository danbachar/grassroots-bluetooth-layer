group 'org.permissionlesstech.grassroots_bluetooth_layer'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'org.permissionlesstech.grassroots_bluetooth_layer'

    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // 22 is the floor because a peripheral's only direct report of the
        // negotiated ATT MTU is BluetoothGattServerCallback.onMtuChanged,
        // which does not exist below it. On 21 that side has no way at all to
        // learn the MTU, and a path left on the 23-byte default cannot carry
        // even one packet header.
        minSdkVersion 22
    }
}
