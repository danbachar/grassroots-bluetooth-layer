name: grassroots_bluetooth_layer
description: Unified bondless BLE central and peripheral transport plugin for Grassroots-style peer discovery.
version: 0.3.0
homepage: https://github.com/danbachar/grassroots-bluetooth-layer
repository: https://github.com/danbachar/grassroots-bluetooth-layer
issue_tracker: https://github.com/danbachar/grassroots-bluetooth-layer/issues

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.10.0

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
  pigeon: ^17.3.0

flutter:
  plugin:
    platforms:
      android:
        package: org.permissionlesstech.grassroots_bluetooth_layer
        pluginClass: GrassrootsBluetoothPlugin
      ios:
        pluginClass: GrassrootsBluetoothPlugin
